# electron-builder 26 key names. docs/research/electron-vite-builder.md has the map to 27.
appId: com.levan.musicplayer # Matches APP_ID in src/main/index.ts. The NSIS GUID derives from it, so it never changes.
productName: Music Player
copyright: Copyright © 2026 Levan
directories:
  buildResources: build
  output: release

files:
  - out/**
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/better-sqlite3/prebuilds/!(win32-x64).node'
  # This one platform on the CPU: the package is 296 MB as installed, and the app only runs on Windows.
  - '!node_modules/onnxruntime-node/bin/napi-v6/{linux,darwin}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/x64/{DirectML,dxcompiler,dxil}.dll'
  - '!node_modules/onnxruntime-node/script/**'
asarUnpack:
  - '**/*.node'
  # The binding loads this from beside itself, and Windows can't load a DLL out of an asar.
  - 'node_modules/onnxruntime-node/bin/napi-v6/win32/x64/onnxruntime.dll'
# better-sqlite3's prebuild is N-API, and a rebuild would need a compiler.
npmRebuild: false

extraResources:
  - from: resources/mpv
    to: mpv
    filter:
      - '**/*'
      - '!*.bat'
      - '!mpv.com'
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg/ffmpeg.exe
  # The GPL asks for its text to travel with the binary.
  - from: node_modules/ffmpeg-static/ffmpeg.exe.LICENSE
    to: ffmpeg/ffmpeg.exe.LICENSE
  - from: node_modules/ffmpeg-static/ffmpeg.exe.README
    to: ffmpeg/ffmpeg.exe.README
  - from: resources/icons
    to: icons
  # The MIT notice for the AutoEq code the correction is ported from.
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # Non-commercial license: downloaded by fetch:binaries, never in git. Without it the app runs, and says so.
  - from: resources/models
    to: models

electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  grantFileProtocolExtraPrivileges: false
  onlyLoadAppFromAsar: true

win:
  target: nsis
  icon: build/icon.ico
  # Not signAndEditExecutable: that also drops the exe's icon and version. This one only skips signing, and resedit
  # does the resources, so the winCodeSign archive and its symlink failure never come up.
  signExecutable: false

nsis:
  artifactName: Music-Player-Setup-${version}.${ext}
  shortcutName: Music Player
  uninstallDisplayName: Music Player
