<!doctype html>
<meta charset="utf-8" />
<title>Media session spike</title>
<body>
  <p id="state">starting</p>
  <script>
    const variant = new URLSearchParams(location.search).get('variant');
    const log = (message) => window.spike.log(message);

    function silentWav(seconds, sampleRate = 8000) {
      const samples = seconds * sampleRate;
      const buffer = new ArrayBuffer(44 + samples * 2);
      const view = new DataView(buffer);
      const text = (offset, value) => [...value].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
      text(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); text(8, 'WAVEfmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      text(36, 'data'); view.setUint32(40, samples * 2, true);
      return new Blob([buffer], { type: 'audio/wav' });
    }

    const audio = new Audio(URL.createObjectURL(silentWav(10)));
    audio.loop = true;
    if (variant === 'muted') audio.muted = true;
    if (variant === 'volume-zero') audio.volume = 0;

    for (const type of ['playing', 'pause', 'error', 'stalled', 'suspend', 'waiting', 'ended']) {
      audio.addEventListener(type, () => log(`audio event ${type} ${audio.error ? audio.error.message : ''}`));
    }

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#c0392b'; ctx.fillRect(0, 0, 256, 256);

    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Spike Title', artist: 'Spike Artist', album: 'Spike Album',
      artwork: [{ src: canvas.toDataURL('image/png'), sizes: '256x256', type: 'image/png' }],
    });
    for (const action of ['play', 'pause', 'stop', 'previoustrack', 'nexttrack', 'seekto', 'seekforward', 'seekbackward']) {
      try {
        navigator.mediaSession.setActionHandler(action, (details) => {
          log(`ACTION ${action} ${details.seekTime ?? ''}`);
          if (action === 'pause') navigator.mediaSession.playbackState = 'paused';
          if (action === 'play') navigator.mediaSession.playbackState = 'playing';
        });
      } catch (error) { log(`no handler for ${action}: ${error.message}`); }
    }
    navigator.mediaSession.playbackState = 'playing';
    navigator.mediaSession.setPositionState({ duration: 300, position: 42, playbackRate: 1 });

    audio.play().then(() => { document.getElementById('state').textContent = 'playing'; log(`play ok (variant ${variant})`); }).catch((error) => log(`play failed ${error.message}`));
  </script>
</body>
